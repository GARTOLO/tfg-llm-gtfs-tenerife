services:
  db:
    image: postgis/postgis
    container_name: tfg_postgis
    environment:
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=gtfs_titsa
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data/raw:/data/raw

  otp:
      image: docker.io/opentripplanner/opentripplanner:latest
      container_name: otp_tfg
      ports:
        - "8080:8080"
      volumes:
        - ./data/otp:/var/opentripplanner
      command: --load --serve
      deploy:
        resources:
          limits:
            memory: 4G
volumes:
  pg_data: